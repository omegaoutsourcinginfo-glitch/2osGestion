[project]
name = "2osgestion"
version = "0.1.0"
description = "Admin-only Django + Unfold — gestion des projets"
authors = [
    {name = "omegaoutsourcinginfo-glitch", email = "omegaoutsourcinginfo-glitch@users.noreply.github.com"}
]
requires-python = ">=3.11,<4"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "django-unfold (>=0.108.0,<0.109.0)",
    "django-environ (>=0.12.0)",
    "django-phonenumber-field[phonenumberslite] (>=8.0.0)",
    "gunicorn (>=25.0.0)",
    "whitenoise (>=6.12.0)",
    "pillow (>=11.0.0)",
    "psycopg[binary] (>=3.2.0)",
    "reportlab (>=4.0.0)",
    "python-docx (>=1.1.0)",
    "openpyxl (>=3.1.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
