{% if dash_recent %}
<div id="dash-recent-list" class="dash-project-cards">
  {% for project in dash_recent %}
  <a
    class="dash-project-card{% if project.statut_actuel == 'EXECUTION' %} is-exec{% else %} is-instr{% endif %}"
    href="{{ project.url }}"
    hx-get="{% url 'projects:project_fiche' project.code %}"
    hx-target="#dash-root"
    hx-swap="outerHTML"
    hx-push-url="{{ project.url }}"
    hx-sync="#dash-root:replace"
  >
    <span class="dash-project-code">{{ project.code }}</span>
    <span class="dash-project-body">
      <strong>{{ project.titre }}</strong>
      <em>{{ project.commune|truncatechars:40 }}</em>
    </span>
    <span class="dash-project-status">{{ project.statut_label }}</span>
  </a>
  {% endfor %}
</div>
{% else %}
<p class="studio-empty" id="dash-recent-list">
  {% if q %}Aucun projet pour « {{ q }} ».{% else %}Aucun projet. <a href="{% url 'admin:projects_project_add' %}">Nouveau projet</a>{% endif %}
</p>
{% endif %}
