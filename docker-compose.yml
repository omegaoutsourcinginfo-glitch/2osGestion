services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      # Dev-only key for Docker; override in production compose/secrets.
      DJANGO_SECRET_KEY: "django-insecure-docker-dev-only-change-me"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web,testserver"
      DJANGO_SQLITE_PATH: /app/data/db.sqlite3
      # For Postgres instead of SQLite, uncomment and start the db service:
      # DJANGO_DB_ENGINE: postgres
      # POSTGRES_DB: 2osgestion
      # POSTGRES_USER: 2osgestion
      # POSTGRES_PASSWORD: change-me
      # POSTGRES_HOST: db
      # POSTGRES_PORT: "5432"
    volumes:
      # Keep database + uploads outside the image (writable)
      - ./data:/app/data
      - ./media:/app/media
      # Live code reload while developing
      - ./core:/app/core
      - ./accounts:/app/accounts
      - ./projects:/app/projects
      - ./templates:/app/templates
      - ./manage.py:/app/manage.py
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
    # Local DX: runserver. Production image default is gunicorn.
    command: python manage.py runserver 0.0.0.0:8000
    # depends_on:
    #   - db

  # Optional PostgreSQL — enable with the web env vars above.
