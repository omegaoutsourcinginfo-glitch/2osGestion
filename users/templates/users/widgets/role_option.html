<label class="uf-role-option inline-flex cursor-pointer items-center gap-2 bg-transparent py-1 text-sm font-semibold text-base-600 shadow-none hover:text-primary-700 dark:text-base-400 dark:hover:text-primary-200">
    <input type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value|stringformat:'s' }}"{% endif %}{% include "django/forms/widgets/attrs.html" %} class="h-4 w-4 shrink-0 cursor-pointer accent-primary-600 shadow-none">
    <span>{{ widget.label }}</span>
</label>
