{% load i18n %}

{% if site_url %}
    <a href="{{ site_url }}" class="mx-1 px-3 py-2 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200">
        {% trans "View site" %}
    </a>
{% endif %}

{% if account_links %}
    {% for link in account_links %}
        <a href="{{ link.link }}" class="mx-1 px-3 py-2 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200">
            {{ link.title }}
        </a>
    {% endfor %}
{% else %}
    {% if user.has_usable_password %}
        <a href="{% url 'admin:password_change' %}" class="mx-1 px-3 py-2 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200">
            {% trans "Change password" %}
        </a>
    {% endif %}
{% endif %}

<div class="border-t border-base-200 mt-1 pt-1 dark:border-base-700" x-data="{ logoutOpen: false }">
    <div class="mx-1">
        <button
            type="button"
            class="bg-none flex cursor-pointer items-center px-3 py-1.5 text-left text-red-700 rounded-default w-full hover:bg-red-100 dark:hover:bg-red-500/20 dark:text-red-400 dark:hover:text-red-400"
            x-on:click.stop="logoutOpen = true"
        >
            {% trans "Log out" %}
            <span class="ml-auto material-symbols-outlined text-red-700 dark:text-red-400">logout</span>
        </button>
    </div>

    <template x-teleport="body">
        <div
            x-cloak
            x-show="logoutOpen"
            x-transition.opacity
            class="fixed inset-0 z-[9999] flex items-center justify-center p-4"
            role="dialog"
            aria-modal="true"
            aria-labelledby="logout-dialog-title"
        >
            <div
                class="absolute inset-0 bg-base-900/50 dark:bg-base-950/70"
                x-on:click="logoutOpen = false"
            ></div>

            <div
                class="relative w-full max-w-sm rounded-xl border border-base-200 bg-white p-5 shadow-xl dark:border-base-700 dark:bg-base-800"
                x-on:click.stop
                x-on:keydown.escape.window="logoutOpen = false"
            >
                <h2 id="logout-dialog-title" class="text-base font-semibold text-font-important-light dark:text-font-important-dark">
                    {% trans "Log out" %}
                </h2>
                <p class="mt-2 text-sm leading-relaxed text-font-default-light dark:text-font-default-dark">
                    {% trans "Are you sure you want to log out?" %}
                </p>

                <div class="mt-5 flex justify-end gap-2">
                    <button
                        type="button"
                        class="inline-flex h-9 items-center rounded-default border border-base-200 px-3 text-sm font-medium hover:bg-base-50 dark:border-base-700 dark:hover:bg-base-700"
                        x-on:click="logoutOpen = false"
                    >
                        {% trans "Cancel" %}
                    </button>
                    <form method="post" action="{% url 'admin:logout' %}">
                        {% csrf_token %}
                        <button
                            type="submit"
                            class="inline-flex h-9 items-center rounded-default bg-primary-600 px-3 text-sm font-medium text-white hover:bg-primary-700"
                        >
                            {% trans "Log out" %}
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </template>
</div>
