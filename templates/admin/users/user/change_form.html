{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block extrastyle %}
{{ block.super }}
<style>
  .user-update-shell {
    max-width: 48rem;
    margin-left: auto;
    margin-right: auto;
  }
  .user-update-shell fieldset {
    border: 1px solid #e2e8f0 !important;
    border-radius: 1rem !important;
    background: #fff !important;
    padding: 1.15rem 1.25rem 1.35rem !important;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .dark .user-update-shell fieldset {
    border-color: #334155 !important;
    background: #1e293b !important;
  }
  .user-update-shell fieldset > h2,
  .user-update-shell fieldset .fieldset-heading {
    margin: 0 0 0.35rem !important;
    font-size: 1.05rem !important;
    font-weight: 750 !important;
    letter-spacing: -0.02em;
  }
  .user-update-shell fieldset .description,
  .user-update-shell fieldset > p {
    margin: 0 0 1rem !important;
    color: #64748b;
    font-size: 0.875rem;
    line-height: 1.45;
  }
  .user-update-shell .form-row {
    margin-bottom: 0.85rem !important;
  }
  .user-update-shell label {
    font-weight: 650 !important;
    font-size: 0.8rem !important;
  }
  /* Keep uploaded profile image preview tiny (was full-size). */
  .user-update-shell .field-image img,
  .user-update-shell .form-row.field-image img,
  .user-update-shell a[href*="/media/users/images/"] img,
  .user-update-shell .flex.items-center img,
  .user-update #content-main img,
  .user-update-shell img {
    max-width: 5rem !important;
    max-height: 5rem !important;
    width: 5rem !important;
    height: 5rem !important;
    object-fit: cover !important;
    border-radius: 0.85rem !important;
  }
  .user-update .user-update-avatar img {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
  }
</style>
{% endblock %}

{% block content %}
<div class="user-update-shell">
    {{ block.super }}
</div>
{% endblock %}
